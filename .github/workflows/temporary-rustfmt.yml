name: Temporary rustfmt

on:
  push:
    branches:
      - agent/use-mdast-blockquote-rules

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/use-mdast-blockquote-rules
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Format and push
        run: |
          cargo fmt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply cargo fmt"
            git push origin HEAD:agent/use-mdast-blockquote-rules
          fi

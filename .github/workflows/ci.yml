name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  compatibility:
    name: TypeScript–Rust differential harness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out pinned TypeScript reference
        uses: actions/checkout@v4
        with:
          repository: luojiyin1987/lint-md
          ref: 9c88a15d43a9dd8637c57157774214a379807d26
          path: compat/core-reference
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build Rust reference binary
        run: cargo build
      - name: Install TypeScript reference dependencies
        run: npm install --prefix compat/core-reference --ignore-scripts --no-audit --no-fund
      - name: Build TypeScript reference
        run: npm run build --prefix compat/core-reference
      - name: Compare implementations
        run: npm test --prefix compat

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  compatibility:
    name: TypeScript–Rust differential and benchmark smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out pinned TypeScript reference
        uses: actions/checkout@v4
        with:
          repository: luojiyin1987/lint-md
          ref: 9c88a15d43a9dd8637c57157774214a379807d26
          path: compat/core-reference
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build Rust reference binary
        run: cargo build
      - name: Install TypeScript reference dependencies
        run: npm install --prefix compat/core-reference --ignore-scripts --no-audit --no-fund
      - name: Build TypeScript reference
        run: npm run build --prefix compat/core-reference
      - name: Compare implementations
        run: npm test --prefix compat
      - name: Generate benchmark workloads
        run: node bench/generate-workloads.mjs
      - name: Smoke test benchmark harness
        env:
          LINT_MD_RS_BIN: ${{ github.workspace }}/target/debug/lint-md-rs
          LINT_MD_CORE_REFERENCE: ${{ github.workspace }}/compat/core-reference/lib/index.js
        run: node bench/run.mjs --smoke --output bench/results/ci-smoke.json --markdown bench/results/ci-smoke.md
      - name: Verify timeout results preserve reports
        env:
          LINT_MD_RS_BIN: ${{ github.workspace }}/target/debug/lint-md-rs
          LINT_MD_CORE_REFERENCE: ${{ github.workspace }}/compat/core-reference/lib/index.js
          LINT_MD_BENCH_COMMAND_TIMEOUT_MS: 50
        run: |
          node bench/run.mjs --smoke --output bench/results/ci-timeout.json --markdown bench/results/ci-timeout.md
          node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('bench/results/ci-timeout.json','utf8'));if(r.status!=='completed-with-timeouts'||!r.workloads.some(w=>w.rust.status==='timeout'||w.typescript.status==='timeout'))process.exit(1)"

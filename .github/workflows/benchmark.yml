name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Reproducible TypeScript–Rust benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out pinned TypeScript reference
        uses: actions/checkout@v4
        with:
          repository: luojiyin1987/lint-md
          ref: 9c88a15d43a9dd8637c57157774214a379807d26
          path: compat/core-reference
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build Rust release binary
        run: cargo build --release
      - name: Install TypeScript reference dependencies
        run: npm install --prefix compat/core-reference --ignore-scripts --no-audit --no-fund
      - name: Build TypeScript reference
        run: npm run build --prefix compat/core-reference
      - name: Generate deterministic workloads
        run: node bench/generate-workloads.mjs
      - name: Run benchmark
        env:
          LINT_MD_BENCH_COMMAND_TIMEOUT_MS: 120000
        run: node bench/run.mjs
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: lint-md-benchmark-${{ github.run_id }}
          path: |
            bench/results/benchmark.json
            bench/results/benchmark.md
          if-no-files-found: error
          retention-days: 30
